<div class="fixed bottom-0 rounded-xl w-1/4 bg-gray-500 h-2/4 object-bottom left-1/2 -translate-x-1/2 invisible" style="z-index: 9999;">
    <div class='lcd-monitor rounded-xl'>
        <span class="flex flex-col gap-0 p-0">
            <p class='text-xl/6 m-0 font-bold' id="song-title">-------</p>
            <p class='text-lg/6 m-0' id="song-author">-----</p>
        </span>
        
        <audio controls src="" id="song-player"></audio>
        <p class='text-center text-sm'></p>
        <button class="w-10 h-5 rounded bg-black" onclick='playSong("-","mortal man","kdot")'>Test</button>
        <!-- h-[1cap] aspect-square для иконок-->
    </div>

    <nav class='flex flex-row p-1 gap-1'>
        <p> navbar </p>
        <a href="{% url 'cassettes-list' %}" class='text-blue-500 hover:underline'>Cassettes</a>
        <a href="{% url 'image-list' %}" class='text-blue-500 hover:underline'>Gallery</a>
        {% comment %} <a href="{% url 'topic-list' %}" class='text-blue-500 hover:underline'>Forum</a> {% endcomment %}
        <a href="{% url 'login' %}" class='text-blue-500 hover:underline'>Login</a>
        <a href="{% url 'register' %}" class='text-blue-500 hover:underline'>Register</a>
        {% if user.is_superuser %}<a href="/admin/" class='text-blue-500 hover:underline'>Admin</a>{% endif %}
    </nav>    
</div>
