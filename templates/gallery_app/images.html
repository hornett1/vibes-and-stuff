{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
    <link rel='stylesheet' href='{% static "gallery_app/images.css" %}'>
    <style>
        html, body {
            height: 100vh;
            margin: 0;
            overflow: auto;
        }

        html {
            position: relative;
            overflow: hidden;
        }

        html::before {
            content: '';
            position: absolute;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url({% static 'textures/brick-wall.jpg' %});
            background-repeat: repeat;
            background-size: 50%;
            filter: saturate(1.5) brightness(0.7) contrast(1.15);
            z-index: -1;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="grid-images container mx-auto p-10 bg-gray-100">
        <form onsubmit="postImage(event)">
            <div class="grid image">
                <input type="file" id="image" name="image">
                <input type="text" id="title" name="title">
                <button type="submit" class="rounded bg-blue-500 h-10 w-25">Submit</button>
            </div>
        </form>
        {% for image in images %}
            <div class="grid-image bg-[#E9E9E9] rounded-lg shadow-lg overflow-hidden">
                <img 
                    src="{{ image.image.url }}" 
                    alt="{{ image.title }}" 
                    class="w-auto h-auto object-cover"
                >
                <h2 class="mt-2 text-center text-lg font-semibold text-gray-800 p-2">
                    {{ image.title }}
                </h2>
        </div>
        {% endfor %}
        </div>
    </div>
  
  

    <script src='{% static "scripts/gallery_app/images.js" %}'></script>
    <script>
        var csrftoken = '{{ csrf_token }}';
    </script>
{% endblock %}
