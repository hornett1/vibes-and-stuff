{% load static %}

<section 
    data-cassetteId="{{ cassette.id }}" 
    data-title="{{ cassette.title }}" 
    data-author="{{ cassette.author }}" 
    class="cassette relative w-full shrink-0 max-w-[70%] snap-center aspect-[102/64] px-8 pt-7 rounded-2xl" style="background: url({% static 'textures/concrete-wall-2.png' %});
    background-color: {{cassette.color1}};
    background-blend-mode: overlay;
    box-shadow: inset 0.2rem 0.2rem 6px rgba(255,255,255, 0.5), 0 0 6px rgba(0,0,0, 0.5);
    --index: {{forloop.counter}}">
    <a {% if user == cassette.uploader  %}href="{% url 'delete-cassette' cassette.id %}"{% endif %} class="absolute right-0 top-0 m-1.5 rounded-full size-6.5 bg-gray-300 metallicss" style="--convexity: 2; --metal: neutral;">
        {% if user == cassette.uploader  %}<i class="fa-solid fa-scissors text-red-800"></i>
        {% else %}<i class="fa-solid fa-plus"></i>
        {% endif %}
    </a>
    <a {% if user == cassette.uploader  %}href="{% url 'delete-cassette' cassette.id %}"{% endif %} class="absolute left-0 top-0 m-1.5 rounded-full size-6.5 bg-gray-300 metallicss" style="--convexity: 2; --metal: neutral;">
        {% if user == cassette.uploader  %}<i class="fa-solid fa-scissors text-green-800"></i>
        {% else %}<i class="fa-solid fa-plus"></i>
        {% endif %}
    </a>
    <a class="absolute left-0 bottom-0 m-1.5 rounded-full size-6.5 bg-gray-300 metallicss" style="--convexity: 2; --metal: neutral;">
        <i class="fa-solid fa-plus"></i>
    </a>
    <a class="absolute right-0 bottom-0 m-1.5 rounded-full size-6.5 bg-gray-300 metallicss" style="--convexity: 2; --metal: neutral;">
        <i class="fa-solid fa-plus"></i>
    </a>
    <div class="paper w-full h-4/5 rounded-lg" style="background: url({% static 'textures/clean-gray-paper.png' %}); background-color: cornsilk; box-shadow: 0.2rem 0.2rem 6px rgba(255,255,255, 0.5)">
        <article class="absolute left-1/2 -translate-x-1/2 w-full px-5 max-h-4/11 truncate" style="z-index: 400;">
            <p {% if user == cassette.uploader  %} contenteditable="true" data-id="{{ cassette.id }}" onclick="enableEdit()" {% endif %} class="permanent-marker-regular title editable text-7xl truncate">{{cassette.title}}</p>
            <p {% if user == cassette.uploader  %} contenteditable="true" data-id="{{ cassette.id }}" onclick="enableEdit()" {% endif %} class="permanent-marker-regular author editable text-black/80 text-5xl truncate">{{cassette.author}}</p>
            <span class="permanent-marker-regular text-red-500/60">
                <a href="{% url 'profile' cassette.uploader.id %}">{{cassette.uploader.username}}</a>
            </span>
        </article>
        <div id="center-row" class="w-full relative top-1/2 -translate-y-1/2 h-4/11 bg-gray-800">
            <div class="w-full h-1/3" style="background: url({% static 'textures/clean-gray-paper.png' %}); background-color: {{cassette.color2}};"></div>
            <div class="w-full h-1/3" style="background: url({% static 'textures/clean-gray-paper.png' %}); background-color: {{cassette.color3}};"></div>
            <div class="w-full h-1/3" style="background: url({% static 'textures/clean-gray-paper.png' %}); background-color: {{cassette.accent_color}};"></div>
            <div class="w-2/3 h-full absolute left-1/2 -translate-x-1/2 top-0 rounded-full" style="box-shadow: 0 0 5px rgba(0, 0, 0, 0.5), inset 0.2rem 0.2rem 6px rgba(255,255,255, 0.5); background: url({% static 'textures/concrete-wall-2.png' %});
            background-color: {{cassette.color1}};
            background-blend-mode: overlay;">
                <div class="absolute left-0 inset-y-0 mx-[4%] my-auto aspect-square w-1/5 rounded-full bg-black overflow-hidden" style="box-shadow: inset 0 0 5px rgba(0,0,0,0.5);">
                    <svg class="" width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="97" fill="none" stroke="cornsilk" stroke-width="10"/>
                        <g transform="translate(100,100)">
                            <g id="tooth">
                            <rect x="-10" y="-100" width="25" height="25" fill="cornsilk"/>
                            </g>
                            <use href="#tooth" transform="rotate(60)"/>
                            <use href="#tooth" transform="rotate(120)"/>
                            <use href="#tooth" transform="rotate(180)"/>
                            <use href="#tooth" transform="rotate(240)"/>
                            <use href="#tooth" transform="rotate(300)"/>
                        </g>
                    </svg>
                </div>
                <!-- <div class="absolute left-1/2 -translate-x-1/2 w-1/5 aspect-square bg-red-500 my-auto inset-y-0"></div> -->
                <div class="absolute right-0 inset-y-0 mx-[4%] my-auto aspect-square w-1/5 bg-black overflow-hidden rounded-full" style="box-shadow: inset 0 0 5px rgba(0,0,0,0.5);">
                    <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="inset-shadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feComponentTransfer in="SourceAlpha">
                                    <feFuncA type="table" tableValues="1 0"/>
                                </feComponentTransfer>
                                <feGaussianBlur stdDeviation="4"/>
                                <feOffset dx="4" dy="4" result="offsetblur"/>
                                <feFlood flood-color="black" result="color"/>
                                <feComposite in2="offsetblur" operator="in"/>
                                <feComposite in2="SourceAlpha" operator="in" />
                                <feComposite in2="color" operator="in" />
                            </filter>
                        </defs>
                        <circle cx="100" cy="100" r="97" fill="none" stroke="cornsilk" stroke-width="10"/>
                        <g transform="translate(100,100)" >
                            <g id="tooth">
                                <rect x="-10" y="-100" width="25" height="25" fill="cornsilk"/>
                            </g>
                            <use href="#tooth" transform="rotate(60)"/>
                            <use href="#tooth" transform="rotate(120)"/>
                            <use href="#tooth" transform="rotate(180)"/>
                            <use href="#tooth" transform="rotate(240)"/>
                            <use href="#tooth" transform="rotate(300)"/>
                            <use href="#tooth" transform="rotate(360)"/>
                        </g>
                    </svg>
                </div>
            </div>                                       
        </div>
        <ul class="absolute flex flex-row w-[70%] left-1/2 -translate-x-1/2 bottom-0 p-5 gap-1 h-1/3 text-center justify-center items-start" style="z-index: 4000">
            {% for song in cassette.songs.all %}
            <li class="list-none px-2 h-[1.1rem] permanent-marker-regular flex items-center gap-1">
                <button class="text-black cursor-pointer" onclick="playSong('{{song.source}}', '{{song.title}}', '{{song.author}}', this)">{{ song.title }}</button>
            </li>
            {% endfor %}
        </ul>
    </div>
    <div class="mx-auto trapezoid w-9/12 h-1/5" style="background: url({% static 'textures/concrete-wall-2.png' %});
    background-color: {{cassette.color1}};
    background-blend-mode: overlay;
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.5), inset 0.2rem 0.2rem 6px rgba(255,255,255, 0.5)">
    </div>
    <!-- <div class="rounded-full w-8 aspect-square bg-black/70 -translate-y-9 translate-x-21"></div>
    <div class="rounded-full w-8 aspect-square bg-black/70 -translate-y-17 translate-x-80"></div> -->
</section>
