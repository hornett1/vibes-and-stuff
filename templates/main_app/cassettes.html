{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
    {% include 'main_app/gsap-init.html' %}
    <style>
        html, body {
            height: 100vh;
            margin: 0;
            overflow: auto;
        }

        html {
            position: relative;
            overflow: hidden;
        }

        html::before {
            content: '';
            position: absolute;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url({% static 'textures/brick-wall.jpg' %});
            background-repeat: repeat;
            background-size: 50%;
            filter: saturate(1.5) brightness(0.7) contrast(1.15);
            z-index: -1;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="w-full h-full text-center">
        <ul class="gallery h-dvh p-5 gap-5 pb-15 perspective-midrange" id="carousel">
            <li class="relative w-full shrink-0 max-w-[12%] snap-center h-[98%] px-8 pt-7 bg-blue-500 window">
                <a class="window-body text-7xl w-full h-full" href="{% url 'create-cassette' %}">+</a>
            </li>
            {% include 'main_app/cassettes-list.html' %}
        </ul>
    </div>

    <input type="hidden" id="block" value="{{ page_obj.number }}">
    <input type="hidden" id="blocks" value="{{ page_obj.paginator.num_pages }}">
    <script src="{% static 'scripts/endless-list.js' %}"></script>
    <script src="{% static 'scripts/main_app/cassettes.js' %}"></script>
    <script type="text/javascript" src="{% static 'scripts/main_app/cassettes-scroll.js' %}"></script>
    <script type="text/javascript" src="{% static 'scripts/main_app/carousel.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const colorPicker = document.getElementById('color1');
            const backgroundElement = document.getElementById('body');
            const island = document.getElementById('island');
    
            colorPicker.addEventListener('input', function() {
                backgroundElement.style.backgroundColor = colorPicker.value;
                island.style.backgroundColor = colorPicker.value;
            });
        });

        var csrf_token = '{{ csrf_token }}';
    </script>
{% endblock %}
