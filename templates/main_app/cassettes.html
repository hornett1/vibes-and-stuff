{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href="{% static 'main_app/cassettes.css' %}">
    {% include 'main_app/gsap-init.html' %}
    <style>
        html, body {
            height: 100vh;
            margin: 0;
            overflow: auto;
        }

        html {
            position: relative;
            overflow: hidden;
        }

        html::before {
            content: '';
            position: absolute;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.8);
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url({% static 'textures/brick-wall.jpg' %});
            background-repeat: repeat;
            background-size: 50%;
            filter: saturate(1.5) brightness(0.7) contrast(1.15);
            z-index: -1;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="w-full h-full text-center">
        <ul class="gallery h-dvh p-5 gap-5 pb-15 perspective-midrange" id="carousel">
            <!-- Cassette Section (Ghost Cassette) -->
            <section class="relative w-full shrink-0 max-w-[70%] snap-center aspect-[102/64] shadow-xl px-8 pt-7 rounded-2xl border-5 border-gray-300/60 bg-gray-500/40 backdrop-blur-md transform transition-transform duration-500">
                <div class="w-full h-4/5 rounded-lg border-5 border-gray-300/60 bg-[cornsilk]/40">
                    <input type="text" class="cassette-title absolute permanent-marker-regular text-7xl left-1/2 -translate-x-1/2 truncate text-gray-300/100 placeholder:text-center text-center" placeholder="Cassette Title" style="z-index: 400">
                    <div id="center-row" class="cassette-controls w-full relative top-1/2 -translate-y-1/2 h-4/11">
                        <div class="cassette-reel w-2/3 h-full absolute left-1/2 -translate-x-1/2 top-0 rounded-full border-5 border-gray-300/60 bg-gray-500/30" style="box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);">
                            <div class="reel-left absolute left-0 inset-y-0 mx-[4%] my-auto aspect-square w-1/5 rounded-full bg-black/60 overflow-hidden" style="box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);">
                                <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="100" cy="100" r="97" fill="none" stroke="oklch(0.872 0.01 258.338)" stroke-width="10"/>
                                    <g transform="translate(100, 100)">
                                        <g id="toothghost">
                                            <rect x="-10" y="-100" width="25" height="25" fill="oklch(0.872 0.01 258.338)"/>
                                        </g>
                                        <use href="#toothghost" transform="rotate(60)"/>
                                        <use href="#toothghost" transform="rotate(120)"/>
                                        <use href="#toothghost" transform="rotate(180)"/>
                                        <use href="#toothghost" transform="rotate(240)"/>
                                        <use href="#toothghost" transform="rotate(300)"/>
                                    </g>
                                </svg>
                            </div>
                            <div class="reel-right absolute right-0 inset-y-0 mx-[4%] my-auto aspect-square w-1/5 bg-black/60 overflow-hidden rounded-full" style="box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);">
                                <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="100" cy="100" r="97" fill="none" stroke="oklch(0.872 0.01 258.338)" stroke-width="10"/>
                                    <g transform="translate(100, 100)">
                                        <g id="toothghost">
                                            <rect x="-10" y="-100" width="25" height="25" fill="oklch(0.872 0.01 258.338)"/>
                                        </g>
                                        <use href="#toothghost" transform="rotate(60)"/>
                                        <use href="#toothghost" transform="rotate(120)"/>
                                        <use href="#toothghost" transform="rotate(180)"/>
                                        <use href="#toothghost" transform="rotate(240)"/>
                                        <use href="#toothghost" transform="rotate(300)"/>
                                        <use href="#toothghost" transform="rotate(360)"/>
                                    </g>
                                </svg>
                            </div>
                        </div>                                       
                        <button class="w-full h-1/3 border-t-2 border-gray-300/60 cursor-pointer" style="z-index: 9999;"></button>
                        <div class="w-full h-1/3 border-y-2 border-gray-300/60"></div>
                        <div class="w-full h-1/3 border-b-2 border-gray-300/60"></div>
                    </div>
                </div>
                <div class="mx-auto trapezoid w-9/12 h-1/5 border-5 border-gray-300/60"></div>
            </section>
            {% include 'main_app/cassettes-list.html' %}
        </ul>
    </div>

    <input type="hidden" id="block" value="{{ page_obj.number }}">
    <input type="hidden" id="blocks" value="{{ page_obj.paginator.num_pages }}">
    <script src="{% static 'scripts/endless-list.js' %}"></script>
    <script src="{% static 'scripts/main_app/cassettes.js' %}"></script>
    <script type="text/javascript" src="{% static 'scripts/main_app/cassettes-scroll.js' %}"></script>
    <script type="text/javascript" src="{% static 'scripts/main_app/carousel.js' %}"></script>
{% endblock %}
